[package]
name = "berth"
version = "0.1.0"
description = "A lightweight macOS terminal workspace"
authors = ["Berth Contributors"]
edition = "2021"

[lib]
name = "berth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
parking_lot = "0.12"
rusqlite = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
trash = "5"
uuid = { version = "1", features = ["v4"] }
